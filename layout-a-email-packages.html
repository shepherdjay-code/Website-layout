<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Layout A — email packages</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/tabler-icons/2.44.0/iconfont/tabler-icons.min.css">
<style>
  * { box-sizing: border-box; }
  body { margin: 0; font-family: 'Source Serif 4', serif; background: #FAF9F6; }
</style>
</head>
<body>
<div style="position: relative; min-height: 100vh; width: 100%; background: #FAF9F6;">
  <div style="position: absolute; top: 40px; left: 40px; right: 40px; display: flex; justify-content: space-between; align-items: flex-end; z-index: 5;">
    <div style="font-size: 61px; font-weight: 500; line-height: 1; letter-spacing: -0.01em; color: #3D3D3A; transform: scaleY(0.85); transform-origin: bottom left;">Layout A</div>
    <div style="display: flex; align-items: flex-end; gap: 24px;">
      <div id="services-item" style="position: relative; cursor: pointer;">
        <div style="font-size: 18px; font-weight: 500; line-height: 1; color: #3D3D3A; padding-bottom: 8px; text-align: center; white-space: nowrap;">services</div>
        <div id="services-bar" style="height: 2px; width: 0; margin: 0 auto; background: #3D3D3A; transition: width 0.3s ease;"></div>
        <div id="services-dropdown" style="position: absolute; top: 28px; left: 50%; transform: translateX(-50%); width: 180px; background: transparent; border: none; padding: 8px 0; opacity: 0; pointer-events: none; transition: opacity 0.15s; z-index: 1000;">
          <div class="opt" style="padding: 5px 8px; font-size: 14px; color: #3D3D3A; text-align: center; cursor: pointer;">email packages</div>
          <div style="padding: 5px 8px; font-size: 14px; color: #3D3D3A; text-align: center;">email renting</div>
          <div style="padding: 5px 8px; font-size: 14px; color: #3D3D3A; text-align: center;">account creation</div>
          <div style="padding: 5px 8px; font-size: 14px; color: #3D3D3A; text-align: center;">sign ups</div>
          <div style="padding: 5px 8px; font-size: 14px; color: #3D3D3A; text-align: center;">virtual assistance</div>
          <div style="padding: 5px 8px; font-size: 14px; color: #3D3D3A; text-align: center;">powerselling</div>
        </div>
      </div>
      <div id="account-item" style="position: relative; cursor: pointer;">
        <div style="font-size: 18px; font-weight: 500; line-height: 1; color: #3D3D3A; padding-bottom: 8px; text-align: center; white-space: nowrap;">account</div>
        <div id="account-bar" style="height: 2px; width: 0; margin: 0 auto; background: #3D3D3A; transition: width 0.3s ease;"></div>
        <div id="account-dropdown" style="position: absolute; top: 28px; left: 50%; transform: translateX(-50%); width: 140px; background: transparent; border: none; padding: 8px 0; opacity: 0; pointer-events: none; transition: opacity 0.15s; z-index: 1000;">
          <div style="padding: 5px 8px; font-size: 14px; color: #3D3D3A; text-align: center;">account info</div>
          <div style="padding: 5px 8px; font-size: 14px; color: #3D3D3A; text-align: center;">settings</div>
        </div>
      </div>
      <div style="position: relative; padding-bottom: 8px;">
        <i class="ti ti-shopping-bag" style="font-size: 20px; color: #3D3D3A;" aria-hidden="true"></i>
        <div id="cart-badge" style="position: absolute; top: -8px; right: -10px; background: #A32D2D; color: #FCEBEB; font-size: 11px; font-family: sans-serif; width: 16px; height: 16px; border-radius: 50%; display: none; align-items: center; justify-content: center;">0</div>
      </div>
    </div>
  </div>
  <div style="position: absolute; top: 111px; left: 40px; right: 40px; height: 3px; background: #3D3D3A; z-index: 4;"></div>
  <div id="grain" style="position: absolute; top: 150px; left: 40px; right: 40px; bottom: 40px; background-color: #E4D8C4; z-index: 1;">
    <svg style="position: absolute; inset: 0; width: 100%; height: 100%; opacity: 0.5; mix-blend-mode: multiply;"><filter id="n"><feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" stitchTiles="stitch"></feTurbulence></filter><rect width="100%" height="100%" filter="url(#n)"></rect></svg>
    <div style="position: relative; height: 100%; display: flex; flex-direction: column;">
      <div id="sec1" style="position: relative; flex: 1; display: flex; align-items: center; justify-content: center; border-bottom: 1px solid #3D3D3A;">
        <select id="sec1-select" style="position: relative; z-index: 2; padding: 10px 24px; border: 1px solid #3D3D3A; border-radius: 999px; background: #FAF9F6; color: #3D3D3A; font-family: 'Source Serif 4', serif; font-size: 14px; text-align: center; text-align-last: center;">
          <option value="" hidden selected>select a package</option>
          <option>iclouds</option>
          <option>iclouds + ticketmaster accounts</option>
        </select>
      </div>
      <div id="sec2" style="position: relative; flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; border-bottom: 1px solid #3D3D3A;">
        <div class="lock-overlay" style="position: absolute; inset: 0; background: rgba(0,0,0,0.18); transition: opacity 0.3s; z-index: 3;"></div>
        <div style="position: relative; z-index: 2; display: flex; align-items: center; gap: 18px;">
          <i id="qty-left" class="ti ti-chevron-left" style="font-size: 20px; color: #3D3D3A; cursor: pointer;" aria-hidden="true"></i>
          <div id="qty-value" style="font-size: 16px; color: #3D3D3A; min-width: 24px; text-align: center;">1</div>
          <i id="qty-right" class="ti ti-chevron-right" style="font-size: 20px; color: #3D3D3A; cursor: pointer;" aria-hidden="true"></i>
        </div>
        <div style="position: relative; z-index: 2; font-style: italic; font-size: 13.6px; color: #3D3D3A; margin-top: 8px;">each batch contains 750 aliases</div>
      </div>
      <div id="sec3" style="position: relative; flex: 1; display: flex; align-items: center; justify-content: center; gap: 24px; border-bottom: 1px solid #3D3D3A;">
        <div class="lock-overlay" style="position: absolute; inset: 0; background: rgba(0,0,0,0.18); transition: opacity 0.3s; z-index: 3;"></div>
        <div style="position: relative; z-index: 2; font-size: 15px; color: #3D3D3A;">order total</div>
        <div id="order-total" style="position: relative; z-index: 2; font-size: 17px; color: #3D3D3A; font-weight: 500;">-</div>
      </div>
      <div id="sec4" style="position: relative; flex: 1; display: flex; align-items: center; justify-content: center;">
        <div class="lock-overlay" style="position: absolute; inset: 0; background: rgba(0,0,0,0.18); transition: opacity 0.3s; z-index: 3;"></div>
        <div id="add-cart" style="position: relative; z-index: 2; padding: 10px 24px; border: 1px solid #3D3D3A; border-radius: 999px; background: #3D3D3A; color: #FAF9F6; font-size: 14px; cursor: pointer;">add to cart</div>
      </div>
    </div>
  </div>
</div>
<script>
var totals = [495,928.5,1278,1608,1938.75,2362.5,2625,2886,3145.5,3412.5,3737.25,3960,4182.75,4410,4635,4956,5125.5,5319,5514.75,5685];
var qty = 1;
var unlocked = false;

function wireUp(itemId, barId, dropdownId) {
  var item = document.getElementById(itemId);
  var bar = document.getElementById(barId);
  var dropdown = document.getElementById(dropdownId);
  var closeTimer = null;
  function open() {
    if (closeTimer) { clearTimeout(closeTimer); closeTimer = null; }
    bar.style.width = '40px';
    dropdown.style.opacity = '1';
    dropdown.style.pointerEvents = 'auto';
  }
  function scheduleClose() {
    closeTimer = setTimeout(function() {
      bar.style.width = '0';
      dropdown.style.opacity = '0';
      dropdown.style.pointerEvents = 'none';
    }, 150);
  }
  item.addEventListener('mouseenter', open);
  item.addEventListener('mouseleave', scheduleClose);
  dropdown.addEventListener('mouseenter', open);
  dropdown.addEventListener('mouseleave', scheduleClose);
}
wireUp('services-item', 'services-bar', 'services-dropdown');
wireUp('account-item', 'account-bar', 'account-dropdown');

function updateTotal() {
  document.getElementById('order-total').textContent = '\u20ac' + totals[qty - 1].toLocaleString('en-US', {minimumFractionDigits: 2, maximumFractionDigits: 2});
}
function unlock(id) {
  var overlay = document.querySelector('#' + id + ' .lock-overlay');
  if (overlay) { overlay.style.opacity = '0'; overlay.style.pointerEvents = 'none'; }
}
document.getElementById('sec1-select').addEventListener('change', function() {
  if (this.value) {
    unlocked = true;
    qty = 1;
    document.getElementById('qty-value').textContent = qty;
    unlock('sec2');
    unlock('sec3');
    unlock('sec4');
    updateTotal();
  }
});
document.getElementById('qty-left').addEventListener('click', function() {
  if (!unlocked) return;
  if (qty > 1) { qty -= 1; document.getElementById('qty-value').textContent = qty; updateTotal(); }
});
document.getElementById('qty-right').addEventListener('click', function() {
  if (!unlocked) return;
  if (qty < 20) { qty += 1; document.getElementById('qty-value').textContent = qty; updateTotal(); }
});
document.getElementById('add-cart').addEventListener('click', function() {
  if (!unlocked) return;
  var badge = document.getElementById('cart-badge');
  var current = parseInt(badge.textContent, 10) || 0;
  if (current < 10) {
    current += 1;
    badge.textContent = current;
    badge.style.display = 'flex';
  }
});
</script>
</body>
</html>
